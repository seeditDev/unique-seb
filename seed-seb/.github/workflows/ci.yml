name: CI — Student Frontend (seed-seb)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: TypeScript + Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

      # P1 FIX: ESLint now blocks the build. continue-on-error removed.
      - name: ESLint
        run: npx eslint src --ext .ts,.tsx,.js,.jsx --max-warnings 0

      - name: Build
        run: npm run build
        env:
          # Provide dummy env vars so the build doesn't fail on missing config
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'ci-placeholder' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'ci-placeholder' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || 'ci-placeholder' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'ci-placeholder' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'ci-placeholder' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || 'ci-placeholder' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: seed-seb-build
          path: frontend/.output/
          retention-days: 7

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # P1 FIX: Unit tests now block the build. continue-on-error removed.
      # --passWithNoTests is kept: an empty suite is not a failure, but a
      # failing test is.
      - name: Run unit tests
        run: npm test -- --passWithNoTests

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # P1 FIX: npm audit now blocks. continue-on-error removed.
      # High-severity vulnerabilities must be remediated before merging.
      - name: npm audit (high severity)
        run: npm audit --audit-level=high --legacy-peer-deps

  # P1 FIX: New CI gate — Firestore security rules tests must pass on every push.
  # These were previously only run manually. Any rules regression now blocks merge.
  security-rules:
    name: Firestore Security Rules Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start Firestore emulator and run rules tests
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-seed-test \
            "node src/tests/firestoreRules.test.mjs && node src/tests/adversarialEmulator.test.mjs"
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080

