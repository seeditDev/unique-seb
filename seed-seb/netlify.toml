[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = """
      default-src 'self';
      connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.googleapis.com https://raw.githubusercontent.com https://*.workers.dev http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*;
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://www.gstatic.com https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
      font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net;
      img-src 'self' data: blob: https:;
      media-src 'self' blob: data: https:;
      frame-src 'self' https://*.firebaseapp.com;
    """

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
